<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/icon.png">
  <title>TradeX - Your Gateway to Stock Trading and Investments</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">
      <img src="assets/logo.png" alt="Logo">
    </div>
    <nav>
      <div class="nav-links">
        <div class="nav-item"><a href="#">Products</a></div>
        <div class="nav-item"><a href="#">Investments</a></div>
        <div class="nav-item"><a href="#">Markets</a></div>
        <div class="nav-item"><a href="#">More</a></div>
      </div>
    </nav>

  <!-- Search Bar -->  
    <div class="search-bar">
      <input type="text" placeholder="Search Stocks, ETFs...">
      <i class="fa-brands fa-searchengin"></i>
    </div>

  <!-- Navigation Buttons -->
    <div class="nav-buttons">
      <button class="login-btn">Login</button>
      <button class="sign-btn">Sign Up</button>
    </div>
  </header>

  <!-- Main Section -->
  <section class="main">
    <div class="main-text">
      <h1>
        Trade Smart.<br>Grow Your Future
      </h1>
      <p>
        Unlock your potential with powerful <br>tools and intelligent insights
      </p>

      <!-- Account box -->
      <div class="acc-box">
        <form class="mobile-form">
          <input type="tel" placeholder="Enter Mobile Number">
          <button type="submit" class="mobile-btn">Open Free Account</button>
        </form>
      </div>

      <!-- Stats -->
      <div class="stats">      
        <div class="stat-item">
          <i class="fa-solid fa-handshake" style="color: #329bec;"></i>
          <p>1.2 Cr+ Users</p>
        </div>
        <div class="stat-item">
          <i class="fa-solid fa-star" style="color: #FFD43B;"></i>
          <p>4.9 App Rating</p>
        </div>
      </div>
    </div>

    <!-- Main Image -->
    <div class="main-image">
      <img src="assets/main.webp" alt="dashboard">
    </div>
  </section>
 
</body>
</html>
